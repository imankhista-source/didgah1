<!DOCTYPE html>
<html lang="fa" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>دیدگاه</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
color:#222;
direction:ltr;
}

.app{
max-width:480px;
margin:auto;
min-height:100vh;
background:white;
direction:ltr;
}


/* متن فارسی */

.logo,
.subtitle,
.title,
.category-name,
.category-description,
.poll-category,
.poll-title,
.poll-description,
.detail-category,
.detail-title,
.detail-description,
.option,
.results-title,
.result-message,
.footer{
direction:rtl;
}


/* HEADER */

header{
padding:24px 20px;
text-align:center;
background:white;
border-bottom:1px solid #eee;
}

.logo{
font-size:30px;
font-weight:bold;
}

.subtitle{
margin-top:7px;
font-size:14px;
color:#777;
}


/* PAGES */

.page{
display:none;
}

.page.active{
display:block;
}


/* MAIN */

main{
padding:20px 16px 40px;
direction:ltr;
}

.title{
text-align:center;
font-size:20px;
font-weight:bold;
margin-bottom:22px;
}


/* CATEGORY */

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
direction:ltr;
}

.category{
background:white;
border:1px solid #e1e5ea;
border-radius:18px;
padding:23px 8px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.05);
transition:.2s;
}

.category:hover{
transform:translateY(-2px);
box-shadow:0 7px 18px rgba(0,0,0,.09);
}

.icon{
font-size:38px;
margin-bottom:9px;
}

.category-name{
font-weight:bold;
font-size:16px;
}

.category-description{
font-size:11px;
color:#777;
margin-top:6px;
}


/* BACK BUTTON */

.back-button{
display:flex;
align-items:center;
justify-content:flex-start;
gap:8px;

border:none;

background:#eef2ff;

color:#4f6df5;

padding:10px 16px;

border-radius:12px;

font-size:14px;

font-weight:bold;

cursor:pointer;

margin-bottom:18px;

box-shadow:0 3px 8px rgba(0,0,0,.06);

transition:.2s;

direction:ltr;
}

.back-button:hover{
background:#e2e8ff;
transform:translateX(-2px);
}

.back-arrow{
font-size:17px;
line-height:1;
}


/* POLL CARD */

.poll-card{
background:white;
border:1px solid #e1e5ea;
border-radius:18px;
overflow:hidden;
margin-bottom:22px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
cursor:pointer;
transition:.2s;
direction:ltr;
}

.poll-card:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.poll-image{
height:175px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:#eef1f5;
direction:ltr;
}

.poll-content{
padding:18px;
direction:rtl;
text-align:right;
}

.poll-category{
font-size:12px;
color:#777;
margin-bottom:7px;
}

.poll-title{
font-size:18px;
font-weight:bold;
line-height:1.7;
margin-bottom:10px;
}

.poll-description{
font-size:13px;
line-height:1.8;
color:#666;
margin-bottom:14px;
}

.poll-info{
display:flex;
justify-content:space-between;
font-size:12px;
color:#777;
direction:ltr;
}


/* POLL DETAIL */

.detail-image{
height:210px;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
background:#eef1f5;
border-radius:18px;
margin-bottom:18px;
direction:ltr;
}

.detail-category{
font-size:13px;
color:#777;
margin-bottom:8px;
text-align:right;
}

.detail-title{
font-size:23px;
font-weight:bold;
line-height:1.7;
margin-bottom:14px;
text-align:right;
}

.detail-description{
font-size:14px;
line-height:2;
color:#666;
margin-bottom:18px;
text-align:right;
}

.detail-info{
display:flex;
justify-content:space-between;
background:#f7f8fa;
border-radius:12px;
padding:13px;
font-size:12px;
color:#666;
margin-bottom:20px;
direction:ltr;
}


/* OPTIONS */

.options{
direction:rtl;
}

.option{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-top:10px;
cursor:pointer;
transition:.2s;
font-size:15px;
text-align:right;
}

.option:hover{
background:#f1f5ff;
border-color:#4f6df5;
}

.option.selected{
border-color:#4f6df5;
background:#eef2ff;
font-weight:bold;
}


/* بعد از ثبت رأی */

.option.locked{
cursor:default;
}

.option.locked:hover{
background:inherit;
border-color:#ddd;
}


/* VOTE BUTTON */

.vote-button{
width:100%;
border:none;
background:#4f6df5;
color:white;
padding:14px;
border-radius:12px;
font-size:16px;
margin-top:18px;
cursor:pointer;
direction:rtl;
transition:.2s;
}

.vote-button:disabled{
opacity:.6;
cursor:not-allowed;
}


/* RESULTS */

.results{
display:none;
margin-top:22px;
padding-top:18px;
border-top:1px solid #eee;
direction:ltr;
}

.results-title{
font-size:17px;
font-weight:bold;
margin-bottom:12px;
text-align:right;
}

.result-row{
margin-top:12px;
direction:ltr;
}

.result-label{
display:flex;
justify-content:space-between;
font-size:13px;
margin-bottom:5px;
direction:ltr;
}

.result-label span:first-child{
direction:rtl;
text-align:right;
}

.result-label span:last-child{
direction:ltr;
}


/* CHART LEFT TO RIGHT */

.result-bar{
height:9px;
background:#e9edf2;
border-radius:10px;
overflow:hidden;
direction:ltr;
width:100%;
}

.result-fill{
height:100%;
background:#4f6df5;
border-radius:0 10px 10px 0;
transform-origin:left center;
}

.result-message{
text-align:center;
font-size:12px;
color:#777;
margin-top:14px;
}


/* FOOTER */

.footer{
text-align:center;
font-size:11px;
color:#aaa;
padding:20px;
}

</style>

</head>


<body>


<div class="app">
