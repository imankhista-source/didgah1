<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دیدگاه</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .welcome {
      background: white;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .welcome h1 {
      margin-top: 0;
      font-size: 25px;
    }

    .welcome p {
      color: #666;
      line-height: 1.8;
    }

    .start-button {
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 16px;
      background: #222;
      color: white;
      cursor: pointer;
      margin-top: 12px;
    }

    .start-button:active {
      transform: scale(0.97);
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">دیدگاه</div>
    <div class="subtitle">صدای شما، بخشی از تصویر جامعه</div>
  </header>

  <main>
    <section class="welcome">
      <h1>به دیدگاه خوش آمدید</h1>

      <p>
        اینجا می‌توانید در نظرسنجی‌های مختلف شرکت کنید،
        نظر خود را ثبت کنید و نتایج دیدگاه مردم را ببینید.
      </p>

      <button class="start-button">
        مشاهده نظرسنجی‌ها
      </button>
    </section>
  </main>

  <footer>
    نسخه اولیه پروژه دیدگاه
  </footer>

</body>
</html>
