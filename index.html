<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

html,
body{
width:100%;
height:100%;
margin:0;
padding:0;
}

body{
background:#f4f6f9;
color:#222;
direction:ltr;
overflow:hidden;
}

.app{
width:100%;
max-width:480px;
height:100dvh;
min-height:100dvh;
margin:auto;
background:white;
direction:ltr;
overflow:hidden;
}

@supports not (height:100dvh){

.app{
height:100vh;
min-height:100vh;
}

}

.logo,
.subtitle,
.title,
.category-name,
.category-description,
.poll-category,
.poll-title,
.poll-description,
.detail-category,
.detail-title,
.detail-description,
.option,
.results-title,
.result-message,
.footer,
.account-title,
.account-message{
direction:rtl;
}

header{
padding:24px 20px;
text-align:center;
background:white;
border-bottom:1px solid #eee;
flex-shrink:0;
}

.logo{
font-size:30px;
font-weight:bold;
}

.subtitle{
margin-top:7px;
font-size:14px;
color:#777;
}

.page{
display:none;
width:100%;
height:100dvh;
min-height:0;
overflow:hidden;
}

.page.active{
display:flex;
flex-direction:column;
height:100dvh;
min-height:0;
}

@supports not (height:100dvh){

.page,
.page.active{
height:100vh;
}

}

main{
padding:16px 16px 20px;
direction:ltr;
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;
overscroll-behavior-y:contain;
}

.title{
text-align:center;
font-size:20px;
font-weight:bold;
margin-bottom:18px;
}

.active-section{
margin-top:10px;
margin-bottom:28px;
}

.section-title{
font-size:18px;
font-weight:bold;
text-align:right;
direction:rtl;
margin-bottom:14px;
}

.active-polls{
display:flex;
flex-direction:column;
gap:12px;
}

.active-poll{
display:flex;
align-items:center;
gap:12px;
padding:13px;
background:#f8f9fc;
border:1px solid #e5e8ee;
border-radius:15px;
cursor:pointer;
transition:.2s;
direction:ltr;
}

.active-poll:hover{
transform:translateY(-2px);
box-shadow:0 5px 14px rgba(0,0,0,.07);
}

.active-poll-icon{
width:48px;
height:48px;
display:flex;
align-items:center;
justify-content:center;
background:white;
border-radius:12px;
font-size:25px;
flex-shrink:0;
}

.active-poll-content{
flex:1;
direction:rtl;
text-align:right;
}

.active-poll-title{
font-size:14px;
font-weight:bold;
line-height:1.6;
}

.active-poll-info{
font-size:11px;
color:#888;
margin-top:4px;
}

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
direction:ltr;
}

.category{
background:white;
border:1px solid #e1e5ea;
border-radius:18px;
padding:23px 8px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.05);
transition:.2s;
}

.category:hover{
transform:translateY(-2px);
box-shadow:0 7px 18px rgba(0,0,0,.09);
}

.icon{
font-size:38px;
margin-bottom:9px;
}

.category-name{
font-weight:bold;
font-size:16px;
}

.category-description{
font-size:11px;
color:#777;
margin-top:6px;
}


/* =========================
ACCOUNT BUTTON
========================= */

.account-button{
display:flex;
align-items:center;
justify-content:center;
gap:7px;
margin:0 0 22px auto;
border:none;
background:#f1f4ff;
color:#4f6df5;
padding:10px 16px;
border-radius:12px;
font-size:14px;
font-weight:bold;
cursor:pointer;
direction:rtl;
transition:.2s;
position:relative;
}

.account-button:hover{
background:#e5eaff;
}


/* =========================
ACCOUNT DROPDOWN
========================= */

.account-menu-wrapper{
position:relative;
display:flex;
justify-content:flex-end;
margin-bottom:18px;
}

.account-menu{
display:none;
position:absolute;
top:48px;
right:0;
width:180px;
background:white;
border:1px solid #e1e5ea;
border-radius:14px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
padding:8px;
z-index:20;
direction:rtl;
}

.account-menu.show{
display:block;
}

.account-menu-user{
padding:10px 12px;
font-size:13px;
font-weight:bold;
color:#555;
border-bottom:1px solid #eee;
margin-bottom:5px;
word-break:break-word;
}

.account-menu-item{
width:100%;
border:none;
background:white;
padding:11px 12px;
border-radius:10px;
text-align:right;
font-size:13px;
cursor:pointer;
direction:rtl;
}

.account-menu-item:hover{
background:#f5f6f8;
}

.account-menu-item.logout{
color:#d9534f;
}


/* =========================
BACK BUTTON
========================= */

.back-button{
display:flex;
align-items:center;
justify-content:flex-start;
gap:8px;
border:none;
background:#eef2ff;
color:#4f6df5;
padding:10px 16px;
border-radius:12px;
font-size:14px;
font-weight:bold;
cursor:pointer;
margin-bottom:18px;
box-shadow:0 3px 8px rgba(0,0,0,.06);
transition:.2s;
direction:ltr;
flex-shrink:0;
}

.back-button:hover{
background:#e2e8ff;
transform:translateX(-2px);
}

.back-arrow{
font-size:17px;
line-height:1;
}


/* =========================
POLL CARD
========================= */

.poll-card{
background:white;
border:1px solid #e1e5ea;
border-radius:18px;
overflow:hidden;
margin-bottom:22px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
cursor:pointer;
transition:.2s;
direction:ltr;
}

.poll-card:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.poll-image{
height:175px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:#eef1f5;
direction:ltr;
}

.poll-content{
padding:18px;
direction:rtl;
text-align:right;
}

.poll-category{
font-size:12px;
color:#777;
margin-bottom:7px;
}

.poll-title{
font-size:18px;
font-weight:bold;
line-height:1.7;
margin-bottom:10px;
}

.poll-description{
font-size:13px;
line-height:1.8;
color:#666;
margin-bottom:14px;
}

.poll-info{
display:flex;
justify-content:space-between;
font-size:12px;
color:#777;
direction:ltr;
}


/* =========================
POLL DETAIL
========================= */

.detail-image{
height:210px;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
background:#eef1f5;
border-radius:18px;
margin-bottom:18px;
direction:ltr;
}

.detail-category{
font-size:13px;
color:#777;
margin-bottom:8px;
text-align:right;
}

.detail-title{
font-size:23px;
font-weight:bold;
line-height:1.7;
margin-bottom:14px;
text-align:right;
}

.detail-description{
font-size:14px;
line-height:2;
color:#666;
margin-bottom:18px;
text-align:right;
}

.detail-info{
display:flex;
justify-content:space-between;
background:#f7f8fa;
border-radius:12px;
padding:13px;
font-size:12px;
color:#666;
margin-bottom:20px;
direction:ltr;
}


/* =========================
OPTIONS
========================= */

.options{
direction:rtl;
}

.option{
border:1px solid #ddd;
border-radius:12px;
padding:14px;
margin-top:10px;
cursor:pointer;
transition:.2s;
font-size:15px;
text-align:right;
}

.option:hover{
background:#f1f5ff;
border-color:#4f6df5;
}

.option.selected{
border-color:#4f6df5;
background:#eef2ff;
font-weight:bold;
}

.option.locked{
cursor:default;
}

.option.locked:hover{
background:inherit;
border-color:#ddd;
}


/* =========================
VOTE BUTTON
========================= */

.vote-button{
width:100%;
border:none;
background:#4f6df5;
color:white;
padding:14px;
border-radius:12px;
font-size:16px;
margin-top:18px;
cursor:pointer;
direction:rtl;
transition:.2s;
}

.vote-button:disabled{
opacity:.6;
cursor:not-allowed;
}


/* =========================
RESULTS
========================= */

.results{
display:none;
margin-top:22px;
padding-top:18px;
border-top:1px solid #eee;
direction:ltr;
}

.results-title{
font-size:17px;
font-weight:bold;
margin-bottom:12px;
text-align:right;
}

.result-row{
margin-top:12px;
direction:ltr;
}

.result-label{
display:flex;
justify-content:space-between;
font-size:13px;
margin-bottom:5px;
direction:ltr;
}

.result-label span:first-child{
direction:rtl;
text-align:right;
}

.result-label span:last-child{
direction:ltr;
}

.result-bar{
height:9px;
background:#e9edf2;
border-radius:10px;
overflow:hidden;
direction:ltr;
width:100%;
}

.result-fill{
height:100%;
background:#4f6df5;
border-radius:0 10px 10px 0;
transform-origin:left center;
transition:width .4s ease;
}

.result-message{
text-align:center;
font-size:12px;
color:#777;
margin-top:14px;
}


/* =========================
ACCOUNT PAGE
========================= */

.account-box{
background:white;
border:1px solid #e1e5ea;
border-radius:18px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
direction:rtl;
}

.account-title{
font-size:21px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.account-input{
width:100%;
border:1px solid #ddd;
border-radius:12px;
padding:13px;
font-size:15px;
margin-top:10px;
outline:none;
direction:rtl;
text-align:right;
background:white;
}

.account-input:focus{
border-color:#4f6df5;
}

.account-submit{
width:100%;
border:none;
background:#4f6df5;
color:white;
padding:13px;
border-radius:12px;
font-size:15px;
font-weight:bold;
margin-top:16px;
cursor:pointer;
transition:.2s;
}

.account-submit:hover{
background:#405edb;
}

.forgot-password{
display:block;
text-align:left;
margin-top:12px;
font-size:13px;
color:#4f6df5;
cursor:pointer;
}

.remember-row{
display:flex;
align-items:center;
justify-content:flex-start;
gap:8px;
margin-top:14px;
font-size:13px;
color:#555;
direction:rtl;
cursor:pointer;
}

.remember-row input{
width:17px;
height:17px;
accent-color:#4f6df5;
cursor:pointer;
}

.account-switch{
text-align:center;
margin-top:20px;
font-size:13px;
color:#777;
}

.account-switch span{
color:#4f6df5;
font-weight:bold;
cursor:pointer;
}

.account-message{
text-align:center;
font-size:13px;
margin-top:14px;
color:#777;
min-height:20px;
}

.account-back{
margin-bottom:18px;
}


/* =========================
LOGGED IN ACCOUNT
========================= */

.account-user-box{
text-align:center;
direction:rtl;
}

.account-user-icon{
font-size:55px;
margin-bottom:12px;
}

.account-user-name{
font-size:19px;
font-weight:bold;
margin-bottom:8px;
}

.account-user-status{
font-size:13px;
color:#777;
margin-bottom:20px;
}

.logout-button{
width:100%;
border:none;
background:#f1f1f1;
color:#555;
padding:13px;
border-radius:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.logout-button:hover{
background:#e8e8e8;
}


/* =========================
FOOTER
========================= */

.footer{
text-align:center;
font-size:11px;
color:#aaa;
padding:20px;
}


/* =========================
RESPONSIVE
========================= */

@media (max-height:750px){

header{
padding-top:16px;
padding-bottom:16px;
}

main{
padding-top:12px;
padding-bottom:16px;
}

.category{
padding-top:18px;
padding-bottom:18px;
}

.icon{
font-size:32px;
}

}

@media (max-height:650px){

header{
padding-top:11px;
padding-bottom:11px;
}

.logo{
font-size:25px;
}

.subtitle{
font-size:11px;
}

main{
padding-top:10px;
padding-bottom:12px;
}

.title{
font-size:18px;
margin-bottom:16px;
}

.active-section{
margin-bottom:18px;
}

.active-polls{
gap:8px;
}

.active-poll{
padding:9px;
}

.active-poll-icon{
width:40px;
height:40px;
font-size:21px;
}

.active-poll-title{
font-size:12px;
}

.categories{
gap:9px;
}

.category{
padding-top:12px;
padding-bottom:12px;
}

.icon{
font-size:27px;
margin-bottom:5px;
}

.category-name{
font-size:14px;
}

.category-description{
font-size:9px;
margin-top:3px;
}

.detail-image{
height:140px;
font-size:65px;
}

.detail-title{
font-size:20px;
}

.detail-description{
font-size:13px;
line-height:1.7;
}

.option{
padding:10px;
margin-top:6px;
}

.vote-button{
padding:10px;
margin-top:10px;
}

.account-box{
padding:15px;
}

.account-title{
font-size:18px;
margin-bottom:14px;
}

.account-input{
padding:10px;
}

.account-submit{
padding:10px;
margin-top:10px;
}

}


/* =========================
SAFE AREA
========================= */

@supports (padding: max(0px)){

header{
padding-top:max(16px, env(safe-area-inset-top));
}

main{
padding-bottom:max(20px, env(safe-area-inset-bottom));
}

}

</style>
